[package]
name = "cluaiz-builder"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "cluaiz-builder"

[dependencies]
cluaiz-core = { path = "../../engine/core" }
cluaiz-hw = { path = "../../engine/hardware" }
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "=0.4.34"
cluaiz-media = { path = "../../engine/media" }
anyhow = "1.0"
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"

