[package]
name = "cluaiz-builder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
engine-core = { path = "../../inference-engine/engines/core" }
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
parquet = { version = "52.2.0", default-features = false, features = ["flate2", "arrow", "snap"] }
arrow = "52.2.0"
chrono = "=0.4.34"


[[bin]]
name = "compile-lexicons"
path = "src/compile_lexicons.rs"

