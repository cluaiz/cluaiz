<div class="chat-container">
    <div class="chat-messages" id="chat-messages">
        <!-- Messages will appear here -->
    </div>

    <!-- Replying Card (Optional, hidden by default) -->
    <div id="reply-card" class="reply-card hidden">
        <div class="reply-content">
            <span class="reply-label">Replying to</span>
            <p class="reply-text truncate" id="reply-text">Message content...</p>
        </div>
        <button class="icon-btn text-muted hover-text-primary" id="cancel-reply-btn">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Input Area Container -->
    <div class="flex justify-center w-full pb-4 px-2" style="margin-top: auto;">
        <div class="w-full max-w-3xl">
            <!-- Main Input Wrapper -->
            <div class="chat-input-wrapper w-full relative" id="main-input-wrapper"
                style="transition: margin 0.3s; margin-bottom: 0px;">

                <!-- Glow Effect Background -->
                <div
                    class="absolute inset-0 -z-10 rounded-3xl opacity-20 blur-xl transition-all duration-500 bg-gradient-glow">
                </div>

                <!-- The Big Pill / Container -->
                <div id="chat-input-container"
                    class="relative flex flex-col bg-primary rounded-3xl transition-all duration-300 p-2 shadow-input border-border-1px">

                    <!-- Top Row (Contains Left Buttons, Textarea, Right Buttons) -->
                    <div class="flex items-end gap-2 w-full min-h-[40px]" id="input-top-row">

                        <!-- Left Buttons Container -->
                        <div id="left-actions-container"
                            class="flex-shrink-0 flex items-center relative-container pb-2px">

                            <!-- Attach Button & Menu Wrapper -->
                            <div id="attach-wrapper" class="relative-container">
                                <button id="attach-btn"
                                    class="flex items-center justify-center transition-colors p-2 rounded-full text-muted hover-bg-secondary hover-text-accent"
                                    style="background: transparent; border: none;">
                                    <i data-lucide="plus" id="attach-icon"
                                        class="w-5 h-5 transition-transform duration-300"></i>
                                </button>

                                <!-- Attach Menu Dropdown -->
                                <div class="dropdown-menu bottom-up hidden w-56 flex-col p-1 gap-0-5 absolute bottom-full left-0 mb-2 bg-primary border-border-1px rounded-xl shadow-2xl z-50"
                                    id="attach-menu">
                                    <button id="upload-file-btn"
                                        class="dropdown-item w-full text-muted hover-text-accent hover-bg-secondary group">
                                        <i data-lucide="upload-cloud" class="w-4 h-4 group-hover-accent"></i>
                                        Upload File
                                    </button>


                                    <div class="h-px bg-border my-1 mx-2"></div>

                                    <!-- Skills Menu -->
                                    <div class="relative-container w-full" id="skills-menu-wrapper">
                                        <button class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group" id="skills-menu-btn">
                                            <div class="flex-align gap-3">
                                                <i data-lucide="layers" class="w-4 h-4 text-muted group-hover-accent"></i>
                                                Skills
                                            </div>
                                            <i data-lucide="chevron-right" class="w-3-5 h-3-5 text-muted"></i>
                                        </button>
                                        <div class="submenu right-side hidden w-48 flex-col p-1 gap-0-5 absolute bottom-0 left-[97%] ml-1 bg-primary border-border-1px rounded-xl shadow-2xl z-50" id="skills-menu">
                                            <!-- Dynamically populated -->
                                        </div>
                                    </div>

                                    <!-- Plugins Menu -->
                                    <div class="relative-container w-full" id="plugins-menu-wrapper">
                                        <button class="dropdown-item w-full flex-between text-primary hover-text-blue hover-bg-secondary group" id="plugins-menu-btn">
                                            <div class="flex-align gap-3">
                                                <i data-lucide="box" class="w-4 h-4 text-muted group-hover-blue"></i>
                                                Plugins
                                            </div>
                                            <i data-lucide="chevron-right" class="w-3-5 h-3-5 text-muted"></i>
                                        </button>
                                        <div class="submenu right-side hidden w-48 flex-col p-1 gap-0-5 absolute bottom-0 left-[97%] ml-1 bg-primary border-border-1px rounded-xl shadow-2xl z-50" id="plugins-menu">
                                            <!-- Dynamically populated -->
                                        </div>
                                    </div>


                                    <!-- MCP Menu -->
                                    <div class="relative-container w-full" id="mcp-menu-wrapper">
                                        <button class="dropdown-item w-full flex-between text-primary hover-text-emerald hover-bg-secondary group" id="mcp-menu-btn">
                                            <div class="flex-align gap-3">
                                                <i data-lucide="server" class="w-4 h-4 text-muted group-hover-emerald"></i>
                                                MCP
                                            </div>
                                            <i data-lucide="chevron-right" class="w-3-5 h-3-5 text-muted"></i>
                                        </button>
                                        <div class="submenu right-side hidden w-48 flex-col p-1 gap-0-5 absolute bottom-0 left-[97%] ml-1 bg-primary border-border-1px rounded-xl shadow-2xl z-50" id="mcp-menu">
                                            <!-- Dynamically populated -->
                                        </div>
                                    </div>

                                    <!-- Thinking Menu -->
                                    <div class="relative-container w-full" id="thinking-menu-wrapper">
                                        <button
                                            class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group"
                                            id="thinking-menu-btn">
                                            <div class="flex-align gap-3" id="main-thinking-content">
                                                <i data-lucide="zap" class="w-4 h-4 text-muted group-hover-accent"></i>
                                                <span>Thinking</span>
                                            </div>
                                            <i data-lucide="chevron-right" class="w-3-5 h-3-5 text-muted"></i>
                                        </button>
                                        <!-- Nested Thinking Menu -->
                                        <div class="submenu right-side hidden w-56 flex-col p-2-5 gap-1-5 absolute bottom-0 left-[97%] ml-1 bg-primary border-border-1px rounded-xl shadow-2xl z-50"
                                            id="thinking-menu">
                                            <div class="flex-between px-1">
                                                <span class="text-xs font-medium text-primary flex-align gap-2 ">
                                                    <i data-lucide="zap" class="w-3-5 h-3-5 text-accent"></i>
                                                    Thinking Mode
                                                </span>
                                                <button id="think-toggle"
                                                    style="box-sizing: border-box; position: relative; width: 28px; height: 16px; border: 1px solid var(--border-color);"
                                                    class="inline-flex flex-shrink-0 rounded-full transition-colors bg-secondary cursor-pointer">
                                                    <span
                                                        class="inline-block rounded-full bg-white transition-transform"
                                                        style="position: absolute; left: -1px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%) translateX(2px);"
                                                        id="think-toggle-thumb"></span>
                                                </button>
                                            </div>
                                            <div class="h-px bg-border w-full my-1"></div>
                                            <div class="flex-col gap-1-5" id="think-options-on" style="display: none;">
                                                <button
                                                    class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group skill-btn border border-transparent"
                                                    data-skill="Think Deep">
                                                    <div class="flex-align gap-2-5">
                                                        <i data-lucide="brain"
                                                            class="w-3-5 h-3-5 text-muted group-hover-text-accent transition-colors"></i>
                                                        <span>Think Deep</span>
                                                    </div>
                                                </button>
                                                <button
                                                    class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group skill-btn border border-transparent"
                                                    data-skill="Think Lite">
                                                    <div class="flex-align gap-2-5">
                                                        <i data-lucide="zap"
                                                            class="w-3-5 h-3-5 text-muted group-hover-text-accent transition-colors"></i>
                                                        <span>Think Lite</span>
                                                    </div>
                                                </button>
                                            </div>
                                            <div class="flex-col gap-1-5" id="think-options-off" style="display: flex;">
                                                <button
                                                    class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group skill-btn border border-transparent"
                                                    data-skill="Long Answer">
                                                    <div class="flex-align gap-2-5">
                                                        <i data-lucide="align-justify"
                                                            class="w-3-5 h-3-5 text-muted group-hover-text-accent transition-colors"></i>
                                                        <span>Long Answer</span>
                                                    </div>
                                                </button>
                                                <button
                                                    class="dropdown-item w-full flex-between text-primary hover-text-accent hover-bg-secondary group skill-btn border border-transparent"
                                                    data-skill="Short Answer">
                                                    <div class="flex-align gap-2-5">
                                                        <i data-lucide="align-left"
                                                            class="w-3-5 h-3-5 text-muted group-hover-text-accent transition-colors"></i>
                                                        <span>Short Answer</span>
                                                    </div>
                                                </button>
                                            </div>
                                            <div class="flex-col gap-1-5" id="custom-response-length" style="display: none; padding: 0 4px;">
                                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;">
                                                    <span style="font-size: 0.75rem; color: #9ca3af;">Custom Length Map</span>
                                                    <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                                                        <input type="checkbox" id="enable-custom-constraint" style="cursor: pointer; width: 12px; height: 12px;">
                                                        <span style="font-size: 0.7rem; color: #9ca3af;">Enable</span>
                                                    </label>
                                                </div>
                                                <input type="number" id="custom-temp-input" placeholder="Temp (e.g. 0.7)" step="0.1" min="0" max="2" style="background: var(--bg-secondary); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; outline: none; width: 100%;">
                                                <textarea id="custom-prompt-input" placeholder="System Constraint..." style="background: var(--bg-secondary); border: 1px solid var(--border-color); color: #fff; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; outline: none; width: 100%; min-height: 40px; resize: none; margin-top: 4px;"></textarea>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>

                        <!-- Shared Textarea -->
                        <textarea id="chat-textarea" placeholder="Ask AI..." rows="1"
                            class="flex-1 bg-transparent text-primary text-sm font-medium outline-none resize-none custom-scrollbar min-h-[20px] max-h-[144px]"
                            style="border: none; padding: 0; margin-top: 10px; margin-bottom: 10px; line-height: 20px;"></textarea>

                        <!-- Right Buttons Container -->
                        <div id="right-actions-container" class="flex-shrink-0 flex items-center gap-1 pb-2px">

                            <!-- Selected Skills Chips will be inserted here -->
                            <div id="skills-selected-container" class="flex items-center gap-1"></div>

                            <!-- Model Selector -->
                            <div class="relative-container" id="model-wrapper">
                                <button id="model-select-btn"
                                    class="flex items-center gap-1 sm-gap-1-5 px-2 py-1-5 rounded-lg transition-colors text-xs font-medium shrink min-w-0 max-w-[130px] sm-max-w-[160px] text-muted hover-bg-secondary hover-text-primary"
                                    style="border: 1px solid transparent; background: transparent;">
                                    <span class="truncate block" id="selected-model-text">Unknown Model</span>
                                    <i data-lucide="chevron-down" class="w-3-5 h-3-5 flex-shrink-0"></i>
                                </button>

                                <!-- Model Dropdown Menu (dynamically populated from /v1/models/installed) -->
                                <div class="dropdown-menu bottom-up hidden w-56 absolute bottom-full right-0 mb-2 bg-primary border-border-1px rounded-xl shadow-2xl z-50 overflow-hidden"
                                    id="model-menu">
                                    <div class="flex-col p-1-5 gap-1 max-h-64 overflow-y-auto custom-scrollbar" id="model-menu-inner">
                                        <!-- Models will be injected here by JS -->
                                    </div>
                                </div>
                            </div>

                            <!-- Mic Button -->
                            <div id="mic-wrapper" class="flex items-center mr-1" style="display: none;">
                                <button id="btn-mic" type="button"
                                    class="w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center text-muted hover-bg-secondary hover-text-primary transition-colors border-none bg-transparent cursor-pointer"
                                    title="Voice Input (Speech-to-Text)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4.5 h-4.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                                </button>
                            </div>

                            <!-- Send Button (Animated) -->
                            <div id="send-wrapper"
                                class="flex items-center transition-all duration-100 ease-out overflow-hidden w-0 opacity-0 scale-0">
                                <button id="send-btn"
                                    class="w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center bg-accent text-black hover-opacity-90 transition-transform active-scale-95 border-none cursor-pointer">
                                    <i data-lucide="send" class="w-4 h-4 -ml-0-5"></i>
                                </button>
                            </div>

                        </div>
                    </div>

                    <!-- Bottom Toolbar (Visible only in multi line) -->
                    <div id="bottom-toolbar"
                        class="hidden items-center justify-between w-full mt-2 pt-1 border-t border-transparent">
                        <!-- JS will inject left-actions-container here when expanded -->
                        <div id="bottom-left-placeholder" class="flex items-center gap-2"></div>
                        <!-- JS will inject right-actions-container here when expanded -->
                        <div id="bottom-right-placeholder" class="flex items-center gap-1 flex-wrap max-w-full"></div>
                    </div>

                </div>

                <!-- Real-Time Full Telemetry & Context Breakdown Bar (Below Chat Input) -->
                <div id="live-context-bar" class="relative flex items-center justify-between text-xs px-3 pt-1-5 text-muted"
                    style="font-family: monospace; font-size: 0.72rem; opacity: 0.95; user-select: none;">
                    
                    <!-- Left: Generation Performance Stats (Commented out per user request) -->
                    <div class="flex items-center gap-3" id="live-perf-stats" style="color: #a1a1aa;">
                        <!--
                        <span id="live-tps-tag" style="display: none;"><b id="live-tps" style="color: #f4f4f5; font-weight: 500;">0.00</b> TPS</span>
                        <span id="live-time-tag" style="display: none;"><b id="live-time" style="color: #f4f4f5; font-weight: 500;">0.00</b>s</span>
                        <span id="live-ttft-tag" style="display: none;"><b id="live-ttft" style="color: #f4f4f5; font-weight: 500;">0.00</b>s TTFT</span>
                        <span id="live-tokens-tag" style="display: none;"><b id="live-tokens" style="color: #f4f4f5; font-weight: 500;">0</b> Tokens</span>
                        -->
                    </div>

                    <!-- Right: Interactive Context Window Trigger & Popover (Clean, No Emojis, Crisp White Numbers) -->
                    <div class="relative flex items-center gap-2 cursor-pointer" id="live-ctx-wrapper" style="color: #a1a1aa;">
                        <span id="live-ctx-trigger" class="flex items-center gap-1 hover:text-white transition-colors" title="Click to view Context Window breakdown">
                            Context: <b id="live-ctx-used" style="color: #f4f4f5; font-weight: 500;">0</b> / <span id="live-ctx-limit" style="color: #a1a1aa;">—</span> (<span id="live-ctx-pct" style="color: #a1a1aa;">0%</span>)
                        </span>
                        <!-- <span style="color: #52525b;">|</span> -->
                        <!-- <span style="color: #a1a1aa;">Tools: <b id="live-tool-count" style="color: #f4f4f5; font-weight: 500;">0</b></span> -->

                        <!-- Context Popover -->
                        <div id="live-context-popover" class="hidden absolute bottom-full right-0 mb-3 w-72 bg-primary border-border-1px rounded-xl p-3-5 shadow-2xl z-50 text-xs text-primary"
                            style="width: 300px; background: #18181b; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 14px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 10px 10px -5px rgba(0, 0, 0, 0.5); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #f4f4f5;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.82rem; font-weight: 600; color: #a1a1aa;">
                                <span>Context Window</span>
                                <span style="font-size: 0.72rem; color: #71717a;">Model Max: <b id="popover-model-max" style="color: #d4d4d8;">—</b></span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.78rem;">
                                <span style="color: #9ca3af;">Usable Allocated</span>
                                <span id="popover-ctx-total" style="color: #ffffff; font-weight: 600;">0 / — (0%)</span>
                            </div>

                            <!-- Multi-bar progress line (5 pillars) -->
                            <div style="display: flex; height: 5px; border-radius: 9999px; overflow: hidden; background: #27272a; margin-bottom: 12px;">
                                <div id="bar-messages" style="width: 0%; background: #3b82f6; transition: width 0.2s;"></div>
                                <div id="bar-system-prompt" style="width: 0%; background: #eab308; transition: width 0.2s;"></div>
                                <div id="bar-skills" style="width: 0%; background: #ec4899; transition: width 0.2s;"></div>
                                <div id="bar-plugins" style="width: 0%; background: #ea580c; transition: width 0.2s;"></div>
                                <div id="bar-mcp-tools" style="width: 0%; background: #10b981; transition: width 0.2s;"></div>
                            </div>

                            <!-- Breakdown Items -->
                            <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #3b82f6;"></span> Messages</span>
                                    <span><b id="item-messages-val">0</b> <span id="item-messages-pct" style="color: #a1a1aa;">0%</span></span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #eab308;"></span> System prompt</span>
                                    <span><b id="item-system-prompt-val">0</b> <span id="item-system-prompt-pct" style="color: #a1a1aa;">0%</span></span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #ec4899;"></span> Skills</span>
                                    <span><b id="item-skills-val">0</b> <span id="item-skills-pct" style="color: #a1a1aa;">0%</span></span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #ea580c;"></span> Plugins</span>
                                    <span><b id="item-plugins-val">0</b> <span id="item-plugins-pct" style="color: #a1a1aa;">0%</span></span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #10b981;"></span> MCP tools</span>
                                    <span><b id="item-mcp-tools-val">0</b> <span id="item-mcp-tools-pct" style="color: #a1a1aa;">0%</span></span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; color: #71717a;">
                                    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 2px; background: #3f3f46;"></span> Free space</span>
                                    <span><b id="item-free-space-val">—</b> <span id="item-free-space-pct" style="color: #71717a;">—</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
