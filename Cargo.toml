[workspace]
members = [
    "engine/core",
    "engine/media",
    "engine/hardware",
    "engine/models",
    "engine/plan",
    "engine/llama",
    "engine/onnx",
    "engine/runtime",
    "api",
    "agents",
    "context",
    "security",
    "cep",
    "ffi",
    "cmd",
    "terminal",
    "automation/core",
    "automation/host",
    "tools/cluaiz-builder",
    "test/plugin_testing",
]
# Needs the sibling cluaiz-tools checkout (../cluaiz-tools); build it with
# --manifest-path test/comprehensive_e2e_trace/Cargo.toml so a clone of this repo alone builds
exclude = ["test/comprehensive_e2e_trace"]

resolver = "2"

[workspace.package]
# The Engine's version: the only place it is written (see engine/core/build.rs)
version = "0.1.0"
edition = "2021"
authors = ["Cluaiz"]

[workspace.metadata.cluaiz]
# "pre-release" until the public launch, then "stable". Shown as `cluaiz 0.1.0 (pre-release)`
channel = "pre-release"

[profile.dev]
debug = false
split-debuginfo = "off"
