[package]
name = "onnx"
version = "0.1.0"
edition = "2021"
authors = ["Cluaiz Technologies"]

[lib]
name = "cluaiz_onnx"
crate-type = ["cdylib", "rlib"]

[dependencies]
# ── Sovereign ONNX Backend (CPU Multimodal Engine) ──
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs", "download-binaries", "cuda", "directml"] } # ONNX Runtime bindings
anyhow = "1.0"
tracing = "0.1"
engine-core = { path = "../../inference-engine/engines/core" }
neural-core = { path = "../neural_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] } # HuggingFace Tokenizers
image = "0.24"
ndarray = "0.15"
tokio = { version = "1.0", features = ["rt"] }
# ── Audio Decoding: WAV + M4A/AAC support ──
hound = "3.5"
symphonia = { version = "0.5", features = ["aac", "isomp4", "pcm", "wav", "mp3", "mkv", "flac"] }
audiopus = "0.2"
moosicbox_opus = "0.4"
rustfft = "6"
rayon = "1.10"
base64 = "0.22"

[features]
default = []