[package]
name = "cluaiz-automation"
description = "Cluaiz Automation: the flow format, checks, expressions, runner and run records. No Engine code: steps reach the Engine through the StepHost trait."
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "cluaiz_automation"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
hmac = "0.12"
glob = "0.3"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "fs"] }
strsim = "0.11"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
