[package]
name = "cluaiz-video-packaging-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Isolated until Windows and secondary-platform packaging are physically proven.
[workspace]

[features]
native-sdk = ["dep:ffmpeg-next"]

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "=8.1.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }
libloading = "0.8.9"
