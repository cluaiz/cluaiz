[package]
name = "cluaiz-cep-wave-b-contracts"
version = "0.1.0"
edition = "2021"
publish = false

# Exercise the production path resolver without building the api crate or the CUDA backends.
[workspace]

[dependencies]
cluaiz-cep = { path = "../../../cep" }
cluaiz-agents = { path = "../../../agents" }
# api/src/cep/methods/workspace.rs (compiled in by fs_methods_contract) reads the home from cluaiz-core
cluaiz-core = { path = "../../../engine/core" }
base64 = "0.22"
chrono = "0.4"
dirs = "5"
rfd = "0.15"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Same as api/Cargo.toml: rfd's Linux dialog needs libwayland-client; with dlopen it is loaded only when a
# dialog opens, so this crate builds on CI runners and servers without desktop libraries
[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

[[test]]
name = "roots_contract"
path = "roots_contract.rs"

[[test]]
name = "fs_methods_contract"
path = "fs_methods_contract.rs"

[[test]]
name = "folder_picker_contract"
path = "folder_picker_contract.rs"
