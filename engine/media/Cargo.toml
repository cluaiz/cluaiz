[package]
name = "cluaiz-media"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cluaiz-core = { path = "../core" }
anyhow = "1.0"
base64 = "0.22"
infer = "0.22"
mime_guess = "2.0"
image = "0.24"
symphonia = { version = "0.5", features = ["aac", "isomp4", "pcm", "wav", "mp3", "mkv", "flac"] }
audiopus = "0.2"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
pdf-extract = "0.7.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"
libloading = "0.8.9"
sha2 = "0.10"
serde_json = "1.0"

[dev-dependencies]
hound = "3.5"
