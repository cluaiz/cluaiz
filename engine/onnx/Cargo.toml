[package]
name = "onnx-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "onnx_engine"
crate-type = ["rlib"]

[dependencies]
cluaiz-core = { path = "../core" }
cluaiz-media = { path = "../media" }
cluaiz-hw = { path = "../hardware" }
ort = { version = "2.0.0-rc.13", features = ["copy-dylibs", "download-binaries", "cuda", "half"] }
half = "2.4"
rand = "0.8"
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
image = "0.24"
ndarray = "0.15"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
hound = "3.5"
rustfft = "6"
rayon = "1.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# DirectML exists only on Windows. On Linux the prebuilt ONNX Runtime with CUDA also carries
# TensorRT / NV-RTX, and macOS has no CUDA build at all (only CoreML), so the exact "cuda" set
# has no download there: take the closest build
[target.'cfg(windows)'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }

[target.'cfg(not(windows))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["lax-feature-matching"] }

# dlopen of the CUDA runtime libraries by path (`cudnn_driver::load_runtime_libraries`)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
