[package]
name = "cmd"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "cluaiz"
autobins = false

[[bin]]
name = "cluaiz"
path = "src/main.rs"

[dependencies]
# ── Root Architecture ──
cluaiz_api = { package = "cluaiz-api", path = "../api", default-features = false }
cluaiz-core = { path = "../engine/core" }
cluaiz-hw = { path = "../engine/hardware" }
cluaiz-models = { path = "../engine/models" }
cluaiz-media = { path = "../engine/media" }
cluaiz-plan = { path = "../engine/plan" }
cluaiz-runtime = { path = "../engine/runtime", default-features = false }
cluaiz-agents = { path = "../agents" }
cluaiz-security = { path = "../security" }
onnx-engine = { path = "../engine/onnx" }


# ── Terminal ──
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
colored = "2.1"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
anyhow = "1.0"
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = "0.3.19"
tracing = "0.1.44"
rand = "0.8"
serde_yaml = "0.9"

ctrlc = "3.5.2"
unicode-width = "0.2"

[build-dependencies]
winres = "0.1"

[features]
# Each GPU feature builds that ggml backend as a library beside the binary; the binary itself
# links no GPU runtime (engine/llama/build.rs). `--no-default-features` builds the CPU-only set.
default = ["cuda"]
cuda = ["cluaiz-runtime/cuda"]
metal = ["cluaiz-runtime/metal"]
vulkan = ["cluaiz-runtime/vulkan"]
rocm = ["cluaiz-runtime/rocm"]
