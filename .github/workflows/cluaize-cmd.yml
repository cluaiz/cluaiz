name: cluaiz CLI

on:
  push:
    paths:
      - 'cmd/**'
      - 'engine/media/**'
      - 'engine/core/**'
      - 'tools/cluaiz-builder/**'
      - '.github/workflows/cluaize-cmd.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0-alpha)'
        required: true
        default: 'alpha-release'
      native_media_url:
        description: 'Reviewed Windows x64 native media ZIP (HTTPS; manifest at archive root)'
        required: false
        type: string
      native_media_sha256:
        description: 'Expected SHA-256 of the reviewed ZIP'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  # 🛡️ Sovereign Compliance: Suppress GitHub's internal Node.js 20 deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Shared OCR/PDF/video assets belong to the host package, not either model kernel.
  # A tag must supply a reviewed package. Other targets retain optional-provider errors.
  package-native-media:
    name: Verify Windows x64 native media package
    if: startsWith(github.ref, 'refs/tags/') || inputs.native_media_url != '' || vars.NATIVE_MEDIA_WIN_X64_URL != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build existing package verifier
        run: cargo build --release -p cluaiz-builder --bin cluaiz-builder
      - name: Verify archive and stage declared assets
        id: media
        shell: pwsh
        env:
          MEDIA_URL: ${{ inputs.native_media_url || vars.NATIVE_MEDIA_WIN_X64_URL }}
          MEDIA_SHA256: ${{ inputs.native_media_sha256 || vars.NATIVE_MEDIA_WIN_X64_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:MEDIA_URL
          if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $env:MEDIA_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'A reviewed HTTPS package URL and its SHA-256 are required; native media cannot be silently omitted from a tag.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'native-media.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'native-media-source'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $env:MEDIA_SHA256) {
            throw 'Native media archive SHA-256 mismatch'
          }
          # Check entry destinations before extraction; only the existing Rust verifier
          # decides which declared, platform-matching files enter the staged artifact.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $root = [IO.Path]::GetFullPath($expanded) + [IO.Path]::DirectorySeparatorChar
            foreach ($entry in $zip.Entries) {
              $destination = [IO.Path]::GetFullPath((Join-Path $expanded $entry.FullName))
              if (-not $destination.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Native media archive entry escapes its extraction directory'
              }
            }
          } finally { $zip.Dispose() }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $expanded 'native-assets.json') | ConvertFrom-Json
          if (-not $manifest.ocr -or -not $manifest.pdf -or -not $manifest.video) {
            throw 'This Windows alpha package requires OCR, PDF rendering and the optional video provider'
          }
          $staged = Join-Path $env:RUNNER_TEMP 'native-media-verified'
          & target/release/cluaiz-builder.exe media-assets --source $expanded --output $staged
          if ($LASTEXITCODE -ne 0) { throw 'Native media manifest verification/staging failed' }
          "package_path=$staged" >> $env:GITHUB_OUTPUT
          "Windows x64 native media: archive digest and every declared asset verified. Other targets and clean-machine inference are not certified by packaging." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload verified native media separately from the executable
        uses: actions/upload-artifact@v4
        with:
          name: cluaiz-native-media-win-x64
          path: ${{ steps.media.outputs.package_path }}
          if-no-files-found: error
          retention-days: 1

  # ─── STAGE 1: CLI Compilation (EXTENDED MATRIX - PC ONLY) ──────────
  build-cli:
    name: 🖥️ Build CLI [${{ matrix.suffix }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win-x64
            ext: exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: win-arm64
            ext: exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: binary
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: binary
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: mac-arm64
            ext: binary
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: mac-x64
            ext: binary

    steps:
      - name: Checkout cluaiz
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 Linker (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV


      - name: Build CLI (Industrial Multi-Platform)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }} -p cmd
          else
            cargo build --release --target ${{ matrix.target }} -p cmd
          fi
        env:
          OPENSSL_VENDORED: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Sovereign Binary Naming ──
      - name: Prepare Sovereign Binary
        id: naming
        shell: bash
        run: |
          # 💎 Sovereign Versioning Logic
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag_name }}"
          else
            VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          fi
          
          SUFFIX="${{ matrix.suffix }}"
          EXT="${{ matrix.ext }}"
          
          if [ "$EXT" == "exe" ]; then
            ORIGINAL="target/${{ matrix.target }}/release/cluaiz.exe"
            DEST="target/${{ matrix.target }}/release/cluaiz-${VERSION}-${SUFFIX}.exe"
          else
            ORIGINAL="target/${{ matrix.target }}/release/cluaiz"
            DEST="target/${{ matrix.target }}/release/cluaiz-${VERSION}-${SUFFIX}"
          fi
          
          mv "$ORIGINAL" "$DEST"
          echo "binary_path=${DEST}" >> $GITHUB_OUTPUT

      - name: 🚀 Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluaiz-cli-${{ matrix.suffix }}
          path: ${{ steps.naming.outputs.binary_path }}
          retention-days: 1

