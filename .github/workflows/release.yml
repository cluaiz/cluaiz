# Builds the core (CLI + API + engine, CPU) for every platform, smoke-tests it on a machine without
# a GPU, and publishes it with every GPU driver as ONE GitHub release page per version.
#
# It runs only when started by hand (Actions -> Release -> Run workflow): pushes never build.
#
# Drivers come from their own workflows, called here so their files land on the same page:
#   cluaize-llama-driver.yml  GGUF: llama.cpp CUDA 12 / CUDA 13 / Vulkan + NVIDIA CUDA runtime
#   cluaize-onnx-driver.yml   ONNX: ONNX Runtime CUDA 12 / CUDA 13 providers (Microsoft builds)
# See .github/workflows/README.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (the release tag is v<version>); must equal version in package.json"
        required: true
      allow_version_mismatch:
        description: "Release even when the version differs from package.json (not recommended)"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
      drivers_run:
        description: "Reuse the GPU drivers of an earlier run (its run ID, from the run's URL) instead of building them again; empty builds them"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Mac build runs on macOS 15; the program keeps running on macOS 14
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  VERSION: ${{ inputs.version }}
  # Compiled into the Engine (cluaiz_core::VERSION): `cluaiz --version`, system.info and the update
  # check report the release's version (the version job checks it equals package.json)
  CLUAIZ_RELEASE_VERSION: ${{ inputs.version }}
  # Smoke-test model: small enough for a CI runner's CPU, a real GGUF chat model
  SMOKE_MODEL: unsloth/Qwen3-0.6B-GGUF:Q4_K_M

jobs:
  # ── Version: the tag must be a version and match package.json, before ~2 hours of builds ─────────
  version:
    name: check version ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version is x.y.z[-pre] and equals package.json
        env:
          ALLOW_MISMATCH: ${{ inputs.allow_version_mismatch }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a version like 0.1.2 or 0.2.0-rc.1 (type it without the leading v)"
            exit 1
          fi
          # The Engine's version has one home: version in package.json (engine/core/build.rs reads it)
          package_version=$(jq -r '.version // empty' package.json)
          if [ -z "$package_version" ]; then
            echo "::error::No version in package.json"
            exit 1
          fi
          if [ "$package_version" != "$VERSION" ]; then
            if [ "$ALLOW_MISMATCH" = "true" ]; then
              echo "::warning::Releasing v$VERSION while package.json says $package_version (allow_version_mismatch)"
            else
              echo "::error::package.json says $package_version but the release is v$VERSION. Set \"version\": \"$VERSION\" in package.json and push first, or start the run with allow_version_mismatch."
              exit 1
            fi
          fi
          echo "Releasing v$VERSION (package.json $package_version)"

  # ── Core: everything that runs on the CPU, for every platform ──────────────────────────────────
  core:
    name: core (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-2022,     experimental: false, features: "" }
          - { name: linux-x64,   os: ubuntu-24.04,     experimental: false, features: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, experimental: true,  features: "" }
          - { name: mac-arm64,   os: macos-15,         experimental: true,  features: "metal" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libssl-dev \
            autoconf automake libtool ccache
          # GCC 13 does not know the 'sme' feature of the armv9.2 CPU variant (llama.cpp uses GCC 14 too)
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Windows runtime isolation
        if: runner.os == 'Windows'
        run: python test/workflows/test_clean_windows_runtime.py

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      # llama.cpp is compiled by CMake inside the llama-engine build script; ccache keeps it between runs
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: core-${{ matrix.name }}
          max-size: 1G

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
          features=()
          [ -n "${{ matrix.features }}" ] && features=(--features "${{ matrix.features }}")
          cargo build -p cmd --release --locked --no-default-features "${features[@]}"

      - name: Package
        id: package
        shell: bash
        run: |
          name="cluaiz-${VERSION}-${{ matrix.name }}"
          bash .github/scripts/package_core.sh target/release "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The core must start and answer on a machine with no GPU and no GPU runtime: unpack it into
      # an empty folder and use only what is inside
      - name: Smoke test (no GPU)
        shell: bash
        run: bash .github/scripts/smoke_test.sh "dist/${{ steps.package.outputs.name }}" "$SMOKE_MODEL"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # ── Drivers: built by their own workflows, published on this release page ──────────────────
  # Skipped when drivers_run names an earlier run: the drivers depend only on the llama.cpp fork
  # commit and the ONNX Runtime version, so a core-only fix need not wait ~2 hours for them again
  gguf-drivers:
    name: GGUF drivers
    needs: version
    if: inputs.drivers_run == ''
    uses: ./.github/workflows/cluaize-llama-driver.yml
    with:
      version: ${{ inputs.version }}

  onnx-drivers:
    name: ONNX drivers
    needs: version
    if: inputs.drivers_run == ''
    uses: ./.github/workflows/cluaize-onnx-driver.yml
    with:
      version: ${{ inputs.version }}

  # ── One release with every file that built, and their checksums ────────────────────────────────
  release:
    name: release v${{ inputs.version }}
    if: always() && needs.core.result == 'success'
    needs: [core, gguf-drivers, onnx-drivers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Drivers from run ${{ inputs.drivers_run }}
        if: inputs.drivers_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.drivers_run }}
          github-token: ${{ github.token }}
          pattern: driver-*
          path: dist
          merge-multiple: true

      # The earlier run named its packs with its own version (cluaiz-0.1.0-...); the installers look
      # for this release's version, so the reused packs are renamed before the core files arrive
      - name: Name the reused drivers for v${{ inputs.version }}
        if: inputs.drivers_run != ''
        run: |
          cd dist
          for f in cluaiz-*; do
            new=$(echo "$f" | sed -E "s/^cluaiz-[0-9]+\.[0-9]+\.[0-9]+[^-]*-/cluaiz-${VERSION}-/")
            [ "$f" = "$new" ] || mv -v "$f" "$new"
          done

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run, or a draft left with this tag: add the files and publish it
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --prerelease=${{ inputs.prerelease }}
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Cluaiz ${VERSION}" \
              ${{ inputs.prerelease && '--prerelease' || '' }} --notes-file .github/release-notes.md
          fi
