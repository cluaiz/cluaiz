# Builds the core (CLI + API + engine, CPU) for every platform, smoke-tests it on a machine without
# a GPU, and publishes it with every GPU driver as ONE GitHub release page per version.
#
# It runs only when started by hand (Actions -> Release -> Run workflow): pushes never build.
#
# Drivers come from their own workflows, called here so their files land on the same page:
#   cluaize-llama-driver.yml  GGUF: llama.cpp CUDA 12 / CUDA 13 / Vulkan + NVIDIA CUDA runtime
#   cluaize-onnx-driver.yml   ONNX: ONNX Runtime CUDA 12 / CUDA 13 providers (Microsoft builds)
# See .github/workflows/README.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (the release tag is v<version>)"
        required: true
        default: "0.1.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}
  # Smoke-test model: small enough for a CI runner's CPU, a real GGUF chat model
  SMOKE_MODEL: unsloth/Qwen3-0.6B-GGUF:Q4_K_M

jobs:
  # ── Core: everything that runs on the CPU, for every platform ──────────────────────────────────
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,     os: windows-2022,     experimental: false, features: "" }
          - { name: linux-x64,   os: ubuntu-24.04,     experimental: false, features: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, experimental: true,  features: "" }
          - { name: mac-arm64,   os: macos-14,         experimental: true,  features: "metal" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libssl-dev \
            autoconf automake libtool ccache

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ccache autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      # llama.cpp is compiled by CMake inside the llama-engine build script; ccache keeps it between runs
      - name: ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: core-${{ matrix.name }}
          max-size: 1G

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
          features=()
          [ -n "${{ matrix.features }}" ] && features=(--features "${{ matrix.features }}")
          cargo build -p cmd --release --locked --no-default-features "${features[@]}"

      - name: Package
        id: package
        shell: bash
        run: |
          name="cluaiz-${VERSION}-${{ matrix.name }}"
          bash .github/scripts/package_core.sh target/release "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The core must start and answer on a machine with no GPU and no GPU runtime: unpack it into
      # an empty folder and use only what is inside
      - name: Smoke test (no GPU)
        shell: bash
        run: bash .github/scripts/smoke_test.sh "dist/${{ steps.package.outputs.name }}" "$SMOKE_MODEL"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # ── Drivers: built by their own workflows, published on this release page ──────────────────
  gguf-drivers:
    name: GGUF drivers
    uses: ./.github/workflows/cluaize-llama-driver.yml
    with:
      version: ${{ inputs.version }}

  onnx-drivers:
    name: ONNX drivers
    uses: ./.github/workflows/cluaize-onnx-driver.yml
    with:
      version: ${{ inputs.version }}

  # ── One release with every file that built, and their checksums ────────────────────────────────
  release:
    name: release v${{ inputs.version }}
    if: always() && needs.core.result == 'success'
    needs: [core, gguf-drivers, onnx-drivers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run, or a draft left with this tag: add the files and publish it
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --prerelease=${{ inputs.prerelease }}
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Cluaiz ${VERSION}" \
              ${{ inputs.prerelease && '--prerelease' || '' }} --notes-file .github/release-notes.md
          fi
