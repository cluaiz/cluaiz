# GGUF GPU drivers: llama.cpp's ggml backends (CUDA 12, CUDA 13, Vulkan) for Windows and Linux,
# plus the NVIDIA CUDA runtime each CUDA driver links. Built from the same pinned fork commit as the
# core (engine/llama/llama.cpp), which loads them from its own folder at start (GGML_BACKEND_DL).
#
# release.yml calls this workflow and publishes its files on the same release page as the core.
# Run it on its own (Actions -> Run workflow) to build the drivers without a release.
name: "cluaiz GGUF Drivers"

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in the file names"
        required: true
        default: "0.1.0"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  # Only the backend library is built; the core provides ggml-base and the CPU backends
  LLAMA_FLAGS: >-
    -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF
    -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=OFF
    -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_OPENSSL=OFF

jobs:
  windows:
    name: "llama ${{ matrix.backend }} (win-x64)"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # No CMAKE_CUDA_ARCHITECTURES: llama.cpp's default set covers every GPU generation the toolkit supports.
          # install.ps1 chooses a pack from these toolkit versions: change both together
          - { backend: cuda12, cuda: "12.4", target: ggml-cuda,   defines: "-DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_CCCL_VERSION=v3.4.3" }
          - { backend: cuda13, cuda: "13.4", target: ggml-cuda,   defines: "-DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_CCCL_VERSION=v3.4.3" }
          - { backend: vulkan, cuda: "",     target: ggml-vulkan, defines: "-DGGML_VULKAN=ON" }
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install CUDA toolkit
        if: matrix.cuda != ''
        uses: ./engine/llama/llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}
          cuda_arch: x64

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S engine/llama/llama.cpp -B build -G "Ninja Multi-Config" %LLAMA_FLAGS% ${{ matrix.defines }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          7z a "dist/cluaiz-$env:VERSION-win-x64-llama-${{ matrix.backend }}.zip" ".\build\bin\Release\${{ matrix.target }}.dll"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ("${{ matrix.cuda }}" -ne "") {
            # The CUDA runtime the driver links (NVIDIA redistributable); the GPU driver itself comes from NVIDIA
            # CUDA 12 keeps the DLLs in bin, CUDA 13 in bin\x64
            $dst = ".\build\cudart"
            foreach ($dir in "$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64") {
              if (Test-Path $dir) {
                robocopy $dir $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
                if ($LASTEXITCODE -ge 8) { exit 1 }
              }
            }
            if (-not (Get-ChildItem "$dst\cublas64_*.dll" -ErrorAction SilentlyContinue)) { Write-Error "CUDA runtime not found under $env:CUDA_PATH"; exit 1 }
            $major = "${{ matrix.backend }}".Replace("cuda", "")
            7z a "dist/cluaiz-$env:VERSION-win-x64-cudart$major.zip" "$dst\*"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: driver-win-x64-llama-${{ matrix.backend }}
          path: dist/*.zip
          if-no-files-found: error

  linux-cuda:
    name: "llama ${{ matrix.backend }} (linux-x64)"
    runs-on: ubuntu-24.04
    container: nvidia/cuda:${{ matrix.image }}-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # install.sh chooses a pack from these toolkit versions: change both together
          - { backend: cuda12, major: "12", image: "12.8.1" }
          - { backend: cuda13, major: "13", image: "13.4.1" }
    steps:
      # The container has no git; install it first so checkout makes a real repository with submodules
      - name: Install git and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build

      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: |
          cmake -S engine/llama/llama.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON $LLAMA_FLAGS \
            -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_CCCL_VERSION=v3.4.3
          cmake --build build -j "$(nproc)" --target ggml-cuda

      - name: Package
        run: |
          mkdir -p dist cudart
          tar -czf "dist/cluaiz-${VERSION}-linux-x64-llama-${{ matrix.backend }}.tar.gz" -C build/bin libggml-cuda.so
          # The CUDA runtime the driver links, as plain files beside it ($ORIGIN)
          for lib in libcudart libcublas libcublasLt; do
            cp -L "/usr/local/cuda/lib64/$lib.so.${{ matrix.major }}" cudart/
          done
          tar -czf "dist/cluaiz-${VERSION}-linux-x64-cudart${{ matrix.major }}.tar.gz" -C cudart .

      - uses: actions/upload-artifact@v4
        with:
          name: driver-linux-x64-llama-${{ matrix.backend }}
          path: dist/*.tar.gz
          if-no-files-found: error

  linux-vulkan:
    name: "llama vulkan (linux-x64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential glslc libvulkan-dev spirv-headers ninja-build

      - name: Build
        run: |
          cmake -S engine/llama/llama.cpp -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON $LLAMA_FLAGS -DGGML_VULKAN=ON
          cmake --build build -j "$(nproc)" --target ggml-vulkan

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/cluaiz-${VERSION}-linux-x64-llama-vulkan.tar.gz" -C build/bin libggml-vulkan.so

      - uses: actions/upload-artifact@v4
        with:
          name: driver-linux-x64-llama-vulkan
          path: dist/*.tar.gz
          if-no-files-found: error
