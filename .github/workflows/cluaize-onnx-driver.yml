# ONNX GPU drivers: ONNX Runtime's CUDA provider for CUDA 12 and CUDA 13, Windows and Linux.
# Nothing is compiled: the providers come from Microsoft's official ONNX Runtime release of the same
# version the core links (read from Cargo.lock through ort-sys), checked against the SHA-256 that
# GitHub lists for each Microsoft file. cuDNN and the CUDA runtime they need are downloaded by the
# engine itself on first GPU use (engine/onnx/src/cudnn_driver.rs).
#
# release.yml calls this workflow and publishes its files on the same release page as the core.
name: "cluaiz ONNX Drivers"

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in the file names"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  cuda:
    name: "onnx ${{ matrix.cuda }} (${{ matrix.platform }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win-x64,   cuda: cuda12, ms: "win-x64-gpu_cuda12",   ext: zip }
          - { platform: win-x64,   cuda: cuda13, ms: "win-x64-gpu_cuda13",   ext: zip }
          - { platform: linux-x64, cuda: cuda12, ms: "linux-x64-gpu_cuda12", ext: tgz }
          - { platform: linux-x64, cuda: cuda13, ms: "linux-x64-gpu_cuda13", ext: tgz }
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # The ONNX Runtime version the core was built with: ort-sys downloads "ms@<version>"
      - name: ONNX Runtime version from Cargo.lock
        run: |
          cargo fetch --locked --manifest-path Cargo.toml >/dev/null
          ort_sys=$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "ort-sys") | .manifest_path' | head -1)
          ort=$(grep -o 'ms@[0-9.]*' "$(dirname "$ort_sys")/build/download/dist.tsv" | sort -u | head -1 | cut -d@ -f2)
          [ -n "$ort" ] || { echo "cannot read the ONNX Runtime version of ort-sys"; exit 1; }
          echo "ORT=$ort" >> "$GITHUB_ENV"
          echo "ONNX Runtime $ort"

      - name: Download and check the Microsoft build
        run: |
          file="onnxruntime-${{ matrix.ms }}-${ORT}.${{ matrix.ext }}"
          expected=$(gh api "repos/microsoft/onnxruntime/releases/tags/v${ORT}" \
            --jq ".assets[] | select(.name == \"$file\") | .digest" | sed 's/^sha256://')
          [ -n "$expected" ] || { echo "$file is not in Microsoft's v${ORT} release"; exit 1; }
          curl -fsSL -o "$file" "https://github.com/microsoft/onnxruntime/releases/download/v${ORT}/$file"
          echo "$expected  $file" | sha256sum -c
          mkdir ms
          if [ "${{ matrix.ext }}" = zip ]; then unzip -q "$file" -d ms; else tar -xzf "$file" -C ms; fi

      - name: Package
        run: |
          mkdir -p pack dist
          # The CUDA provider and the bridge it loads through; TensorRT providers are not used by the engine
          find ms -type f \( -name 'onnxruntime_providers_cuda.dll' -o -name 'onnxruntime_providers_shared.dll' \
            -o -name 'libonnxruntime_providers_cuda.so' -o -name 'libonnxruntime_providers_shared.so' \) -exec cp {} pack/ \;
          ls -la pack
          [ "$(ls pack | wc -l)" -eq 2 ] || { echo "expected the CUDA provider and the shared bridge"; exit 1; }
          name="cluaiz-${VERSION}-${{ matrix.platform }}-onnx-${{ matrix.cuda }}"
          if [ "${{ matrix.ext }}" = zip ]; then (cd pack && zip -q "../dist/$name.zip" *); else tar -czf "dist/$name.tar.gz" -C pack .; fi

      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}-onnx-${{ matrix.cuda }}
          path: dist/*
          if-no-files-found: error
