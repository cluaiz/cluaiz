# Can the Linux core be built on Ubuntu 22.04 (glibc 2.35), so it also runs on Ubuntu 22.04, Debian 12 and WSL
# with Ubuntu 22.04? Builds the core there the way release.yml does, runs the smoke test, prints the newest glibc
# symbol each file needs and runs the core in Debian 12. Only by hand; publishes nothing.
name: Linux compatibility (Ubuntu 22.04 build)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: 0.1.0
  CLUAIZ_RELEASE_VERSION: 0.1.0
  SMOKE_MODEL: unsloth/Qwen3-0.6B-GGUF:Q4_K_M

jobs:
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libssl-dev \
            autoconf automake libtool ccache software-properties-common
          # GCC 14 for the armv9.2 'sme' CPU variant; Ubuntu 22.04 has it only from the toolchain PPA
          if [ "$(uname -m)" = aarch64 ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update -y
            sudo apt-get install -y gcc-14 g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          fi
          cmake --version
          ldd --version | head -n 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: compat-${{ matrix.name }}
          cache-on-failure: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: compat-${{ matrix.name }}
          max-size: 1G

      - name: Build
        run: |
          export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cargo build -p cmd --release --locked --no-default-features

      - name: Package
        id: package
        run: |
          name="cluaiz-${VERSION}-${{ matrix.name }}"
          bash .github/scripts/package_core.sh target/release "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Newest glibc symbol each file needs
        run: |
          cd "dist/${{ steps.package.outputs.name }}"
          for f in cluaiz *.so*; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            printf '%-40s %s\n' "$f" "$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*' | sort -t. -k2 -n -u | tail -n 1)"
          done

      - name: Smoke test on Ubuntu 22.04 (no GPU)
        run: bash .github/scripts/smoke_test.sh "dist/${{ steps.package.outputs.name }}" "$SMOKE_MODEL"

      - name: Runs on Debian 12 (glibc 2.36)
        run: |
          docker run --rm -v "$PWD/dist/${{ steps.package.outputs.name }}:/opt/cz:ro" debian:12 \
            sh -c '/opt/cz/cluaiz --version && /opt/cz/cluaiz status'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-ubuntu22
          path: dist/*.tar.gz
          if-no-files-found: error
