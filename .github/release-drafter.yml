name-template: 'v$RESOLVED_VERSION 🚀'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Highlights'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '⚡ Changes & Optimizations'
    labels:
      - 'performance'
      - 'refactor'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
      - 'docs'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  This is the official public release for cluaiz $RESOLVED_VERSION.
  
  > **Important:** To install cluaiz, run the installer for your operating system (`install.sh` or `install.ps1`). It downloads the core and the GPU pack for your machine from this release and checks each file against `SHA256SUMS.txt`.
  
  $CHANGES
  
  ---
  
  ### ⬇️ Assets (Downloads)
  * 📄 `install.sh` (Mac/Linux Installer)
  * 📄 `install.ps1` (Windows Installer)
  * 📦 Core and GPU packs (attached below)
  * 🔐 `SHA256SUMS.txt` (checksums of every file)
