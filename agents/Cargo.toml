[package]
name = "cluaiz-agents"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
wasmtime = { version = "36.0.19", default-features = false, features = ["cranelift", "runtime", "std"] }
portable-pty = "0.9"
cluaiz-core = { path = "../engine/core" }
cluaiz-models = { path = "../engine/models" }
cluaiz-context = { path = "../context" }
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
async-trait = "0.1"
cluaiz-security = { path = "../security" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zstd = "0.14"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Job objects: an MCP server and the processes it starts end with the Engine
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
wat = "1"
