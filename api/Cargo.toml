[package]
name = "cluaiz-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cluaiz-core = { path = "../engine/core" }
cluaiz-hw = { path = "../engine/hardware" }
cluaiz-models = { path = "../engine/models" }
cluaiz-plan = { path = "../engine/plan" }
cluaiz-runtime = { path = "../engine/runtime" }
cluaiz-agents = { path = "../agents" }
cluaiz-security = { path = "../security" }

axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1.0"
async-stream = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures = "0.3"
sysinfo = "0.33"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
