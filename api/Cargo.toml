[package]
name = "cluaiz-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cluaiz-core = { path = "../engine/core" }
cluaiz-hw = { path = "../engine/hardware" }
cluaiz-models = { path = "../engine/models" }
cluaiz-plan = { path = "../engine/plan" }
cluaiz-runtime = { path = "../engine/runtime" }

axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1.0"
