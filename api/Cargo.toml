[package]
name = "cluaiz-api"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
cluaiz-core = { path = "../engine/core" }
cluaiz-hw = { path = "../engine/hardware" }
cluaiz-models = { path = "../engine/models" }
cluaiz-plan = { path = "../engine/plan" }
cluaiz-runtime = { path = "../engine/runtime", default-features = false }
cluaiz-media = { path = "../engine/media" }
cluaiz-agents = { path = "../agents" }
cluaiz-security = { path = "../security" }
cluaiz-context = { path = "../context" }
cluaiz-cep = { path = "../cep" }
schemars = "1"

axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1.0"
async-stream = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures = "0.3"
sysinfo = "0.33"
dirs = "5.0"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["cuda"]
cuda = ["cluaiz-runtime/cuda"]
metal = ["cluaiz-runtime/metal"]
vulkan = ["cluaiz-runtime/vulkan"]
rocm = ["cluaiz-runtime/rocm"]

[dev-dependencies]
tempfile = "3"
cfb = "0.14"
image = "0.24"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[[test]]
name = "artifact_acceptance"
path = "../test/media_regression/artifact_acceptance.rs"
